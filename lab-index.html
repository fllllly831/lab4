<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            background-color: #f9f9f9;
            margin: 20px 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #000;
            padding: 15px;
            text-align: left;
        }
        .caption {
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            padding: 15px 0;
            color: #333;
        }
        .title {
            font-weight: bold;
            background-color: #666;
            color: #fff;
            padding: 15px;
            border-right: 2px solid #000;
        }
        .content {
            padding: 15px;
            text-align: left;
            line-height: 1.5;
        }
        .photo-cell {
            text-align: center;
            vertical-align: middle;
            padding: 15px;
        }
        .photo-preview {
            max-width: 120px;
            max-height: 150px;
            border: 2px solid #000;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        select {
            padding: 8px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        legend {
            font-weight: bold;
            padding: 5px 10px;
            background-color: #666;
            color: white;
            border-radius: 4px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checkbox-container input[type="checkbox"] {
            margin-right: 10px;
        }
        .checkbox-container input[type="text"] {
            flex-grow: 1;
            margin-left: 10px;
        }
        .add-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <table>
        <caption class="caption">个人简历</caption>
        
        <tr>
            <td class="title">姓名</td>
            <td><input type="text" id="name" value="刘峻泽" maxlength="20"></td>
            <td class="title">性别</td>
            <td>
                <select id="gender">
                    <option value="男" selected>男</option>
                    <option value="女">女</option>
                </select>
            </td>
            <td class="title">年龄</td>
            <td><input type="number" id="age" value="20" min="18" max="100"></td>
            <td class="photo-cell" rowspan="3">
                <img id="photoPreview" class="photo-preview" src="个人照片.jpg" alt="照片预览">
                <input type="file" id="photo" accept="image/*">
            </td>
        </tr>
        
        <tr>
            <td class="title">籍贯 🏯</td>
            <td><input type="text" id="hometown" value="山东滕州" maxlength="20"></td>
            <td class="title">联系电话 📞</td>
            <td><input type="tel" id="phone" value="16572523689" maxlength="11"></td>
            <td class="title">电子邮箱 📧</td>
            <td><input type="email" id="email" value="2909889842@qq.com" maxlength="50"></td>
        </tr>
        
        <tr>
            <td class="title">学历🎓</td>
            <td>
                <select id="education">
                    <option value="本科" selected>本科</option>
                    <option value="硕士">硕士</option>
                    <option value="博士">博士</option>
                    <option value="专科">专科</option>
                </select>
            </td>
            <td class="title">健康状况 💪</td>
            <td>
                <select id="health">
                    <option value="健康" selected>健康</option>
                    <option value="亚健康">亚健康</option>
                    <option value="不健康">不健康</option>
                </select>
            </td>
            <td class="title">婚姻状况 💍</td>
            <td>
                <select id="marital">
                    <option value="未婚" selected>未婚</option>
                    <option value="已婚">已婚</option>
                    <option value="离异">离异</option>
                    <option value="丧偶">丧偶</option>
                </select>
            </td>
        </tr>
        
        <tr>
                    <td class="title">求职意向 💻</td>
                    <td><input type="text" id="job-intent" value="前端工程师" maxlength="30"></td>
                    <td class="title">专业 📚</td>
                    <td colspan="2">
                        <select id="major">
                            <option value="软件工程" selected>软件工程</option>
                            <option value="计算机科学与技术">计算机科学与技术</option>
                            <option value="人工智能">人工智能</option>
                        </select>
                    </td>
                    <td class="title">毕业院校 🏫</td>
                    <td><input type="text" id="university" value="鲁东大学" maxlength="30"></td>
                </tr>
    </table>

    <fieldset>
        <legend>技能证书</legend>
        <div class="checkbox-container">
            <input type="checkbox" id="skill1" checked>
            <label for="skill1"></label>
            <input type="text" value="办公软件熟练使用" maxlength="50">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="skill2" checked>
            <label for="skill2"></label>
            <input type="text" value="英语四级证书" maxlength="50">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="skill3" checked>
            <label for="skill3"></label>
            <input type="text" value="熟悉Linux操作系统" maxlength="50">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="skill4" checked>
            <label for="skill4"></label>
            <input type="text" value="前端开发技能：HTML5、CSS3、JavaScript、React" maxlength="100">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="skill5" checked>
            <label for="skill5"></label>
            <input type="text" value="编程语言：Python、C++" maxlength="50">
        </div>
        <button class="add-button" onclick="addSkill()">添加技能</button>
    </fieldset>

    <fieldset>
        <legend>项目经历</legend>
        <div class="checkbox-container">
            <input type="checkbox" id="project1" checked>
            <label for="project1"></label>
            <input type="text" value="独立开发了一个学生管理系统，使用Python和Django框架" maxlength="100">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="project2" checked>
            <label for="project2"></label>
            <input type="text" value="前端开发，使用HTML5、CSS3和JavaScript" maxlength="100">
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="project3" checked>
            <label for="project3"></label>
            <input type="text" value="参与开发了一款2D平台跳跃游戏，使用Unity引擎" maxlength="100">
        </div>
        <button class="add-button" onclick="addProject()">添加项目</button>
    </fieldset>

    <fieldset>
        <legend>个人特长与爱好</legend>
        <textarea id="hobby" maxlength="200">喜欢探索不同文化；擅长风景和人像摄影，作品曾参加活动；喜欢阅读科技类书籍和小说，定期参加读书俱乐部</textarea>
    </fieldset>

    <fieldset>
        <legend>自我评价</legend>
        <textarea id="selfEvaluation" maxlength="500">我是一名积极向上的大一学生，对学习充满热情，具备良好的团队协作能力和沟通能力。在大学期间，我积极参与社团活动和志愿者服务，锻炼了自己的组织能力和责任感。我擅长使用办公软件和编程语言，能够快速适应新环境并解决实际问题。在未来的学习和工作中，我希望能够不断提升自己的专业能力，为团队和社会做出贡献。我系统掌握了C语言、Python编程基础，熟悉数据结构与算法逻辑，能够独立完成小型项目开发（如学生管理系统）。曾参与团队课程设计，负责模块代码编写与文档整理，具备良好的协作与沟通能力。目前自学前端开发（HTML/CSS/JavaScript），通过GitHub管理代码版本，持续更新技术博客记录学习心得。对技术迭代保持敏锐度，定期阅读《代码整洁之道》等专业书籍，关注人工智能领域动态。擅长通过Stack Overflow等平台解决技术难题，注重代码规范与可维护性。具备快速学习能力，2周内掌握Django框架并完成个人博客搭建。性格踏实严谨，适应高强度学习节奏，未来计划深入后端开发方向，目标通过参与开源项目积累工程经验，逐步成长为全栈工程师。</textarea>
    </fieldset>

    <script>
        // 文件上传预览功能
        document.getElementById('photo').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photoPreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function addSkill() {
            const fieldset = document.querySelector('fieldset:nth-of-type(1)');
            const newDiv = document.createElement('div');
            newDiv.className = 'checkbox-container';
            newDiv.innerHTML = `
                <input type="checkbox" id="newSkill">
                <label for="newSkill"></label>
                <input type="text" placeholder="输入新技能" maxlength="100">
            `;
            fieldset.insertBefore(newDiv, fieldset.querySelector('button'));
        }

        function addProject() {
            const fieldset = document.querySelector('fieldset:nth-of-type(2)');
            const newDiv = document.createElement('div');
            newDiv.className = 'checkbox-container';
            newDiv.innerHTML = `
                <input type="checkbox" id="newProject">
                <label for="newProject"></label>
                <input type="text" placeholder="输入新项目" maxlength="100">
            `;
            fieldset.insertBefore(newDiv, fieldset.querySelector('button'));
        }
    </script>
</body>
</html>
